[project]
name = "sound-server"
version = "1.2.1"
description = "HTTP server for playing sounds on macOS from Docker-based Claude Code"
authors = [
    { name = "Dean Putney" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
]

[project.scripts]
sound-server = "sound_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
