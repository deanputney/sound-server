name: Update Homebrew Formula

on:
  release:
    types: [published]

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sound-server repository
        uses: actions/checkout@v4
        with:
          path: sound-server

      - name: Checkout homebrew-tap repository
        uses: actions/checkout@v4
        with:
          repository: deanputney/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Calculate SHA256 and update formula
        run: |
          cd sound-server

          # Get the version from the release tag
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Version: $VERSION"

          # Wait a bit for PyPI to process the release (if using automatic PyPI publishing)
          echo "Waiting for PyPI to process release..."
          sleep 30

          # Download and calculate SHA256 of the PyPI tarball
          TARBALL_URL="https://files.pythonhosted.org/packages/source/s/sound-server/sound-server-${VERSION}.tar.gz"
          echo "Downloading from: $TARBALL_URL"

          # Retry logic for PyPI (sometimes takes a few minutes to be available)
          for i in {1..5}; do
            SHA256=$(curl -Ls "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)
            if [ -n "$SHA256" ] && [ "$SHA256" != "da39a3ee5e6b4b0d3255bfef95601890afd80709" ]; then
              break
            fi
            echo "Attempt $i: PyPI tarball not ready, waiting 30s..."
            sleep 30
          done

          echo "SHA256: $SHA256"

          # Update the formula
          cd ../homebrew-tap

          # Copy the formula from sound-server repo
          cp ../sound-server/sound-server.rb Formula/sound-server.rb

          # Replace PLACEHOLDER_SHA256 with actual SHA256
          sed -i "s|sha256 \"PLACEHOLDER_SHA256\"|sha256 \"${SHA256}\"|g" Formula/sound-server.rb

          # Update version if there's a placeholder
          sed -i "s|PLACEHOLDER_VERSION|${VERSION}|g" Formula/sound-server.rb

      - name: Commit and push to homebrew-tap
        run: |
          cd homebrew-tap

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/sound-server.rb

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update sound-server formula to ${GITHUB_REF#refs/tags/v}"
            git push
          fi
